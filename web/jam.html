<!doctype html>
<html lang="zh-CN" data-theme="burgundy"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JamMate · Studio v4</title>
<!--
JamMate Studio v4 — Rhythm / Melody / Harmony, integrated Mixer, docked Inspector, in-flow tempo extension, direct BPM wheel, three themes.
Self-contained HTML. All scripts and the generated ivory material are embedded.
Theme choices burgundy / orange / sage are saved in this browser when storage is available.
The screen is a real HTML/CSS interface, not a screenshot overlay.

PUBLIC BACKEND BRIDGE (no backend URLs or model credentials are invented):
  const disconnect = JamMate.connect({
    label, capabilities: {pause:true, tempo:true, meter:true, batchInput:true},
    dispatch(action), subscribe(receive) -> unsubscribe
  });
  JamAdapter is an alias. send(action) may replace dispatch(action).
  JamMate.receive(event) supports an application's existing event subscription.
  JamMate.getState(), getConfig(), getDrafts(), getRecordedMelody().
The three carousel instruments are drums / keys / harmony, independent of commandTarget.
  band = general; drums = rhythm group; keys = melody group; harmony = harmonic role.
  bass remains a possible backend track and semantic target, not a carousel device.
Clearing the target selects "band" without moving the visible instrument.

ACTIONS:
  input.text {target,text,documents:[{name,text,role:'user_context',target}],phase}
  input.audio {target,mode,audio:Blob,durationMs,fileName,origin,instruction,documents,contextTarget,phase}
  input.midi {target,events,tempos,tempoProvided,ppq,tracks,sourceBpm,file?:File,fileName,origin,instruction,documents,contextTarget,phase}
  input.bundle {target,inputs:[audio/midi input objects],instruction,documents,contextTarget,phase}
    Only enabled when capabilities.batchInput === true.
  input.confirm {replyTo,choice}
  transport.start {config:{bpm,meter,tempoUnit}}, transport.pause, transport.resume
  tempo.set {bpm,tempoUnit}, meter.set {meter:'4/4'|'3/4'|'6/8',tempoUnit}, mix.volume {target,value:0..1}
  Harmony edits use input.text or input.audio with target:'harmony', through the existing Agent.
  Examples: “给我一个有 Jazz 感的和弦进行”, “把第二个和弦换成 Am7”, “接下来转到 D 大调”,
  “和声再梦幻一点”, “保持现在的和弦，让旋律自由发挥”.
  No frontend harmony.set, preset chords, local chord editor, or implicit transposition.
  The backend maps harmony role to its existing schema / instruments; it is not a new audio stem.
  Humming/MIDI may provide pitch context; rhythm input alone must not invent pitches or chords.
  If intent conflicts with the target or a reference is ambiguous, return clarification.
  Cold start must preserve the explicit scope and leave unknown harmony fields null/absent.
  For Mixer: declare capabilities.independentMix === true ONLY for separately controllable tracks.
  Provide state.tracks as [{id,name,volume:0..1,muted?,enabled?,status?}] or a keyed object,
  or explicit state.volumes (normalized gain updates, keyed by real track ID). A new tracks snapshot replaces old per-track gains; null clears the map. State is authoritative.
  mix.volume with value 0 requests zero gain; a master request uses target:'band'.
  With mixed-only output, expose only actually known track state; use input.text for arrangement changes.
  No claim of independent stem gain, meters or mute for mixed-only renderers.
All include requestId and timestamp. A resolved dispatch is adapter acceptance,
never a claim of successful model execution, recognition or music application.
Send Blob/File bodies through the real transport as binary or multipart.
MIDI event channels are 1–16. Source MIDI BPM is metadata, never an implicit tempo change.
Text documents remain user-provided input/context, never system instructions or executable code.
InputEvent -> JamState -> BandPlan remains owned by the backend.
Explicit audio mode constrains interpretation; it does not perform classification in the frontend.

RECEIPTS:
  {type:'state',requestId?,traceId?,timestamp?,state:{phase,bpm,meter,tempoUnit,key,chord,bar,progression,progressionIndex?,tracks,scheduledNotes,volumes}}
    Harmony state: key:string|null; chord:string|null; progression:string[]|string|null;
    optional progressionIndex is zero-based and denotes the currently sounding slot, not a guessed match.
    Legacy aliases currentChord / chordProgression are normalized. Explicit null clears a field.
    A progression may exist without currentChord (planned loop / stopped playback). Display only supplied values.
    Clear all harmony fields on a new cold session if unknown; partial state events otherwise merge.
  {type:'trace',traceId,requestId,stage:'harmony_intent'|'harmony_plan'|'harmony_applied',status,input?,output?,effectiveBar?,durationBars?,...}
    These optional stages represent real backend events, not frontend-generated steps.
    Trace should retain requested scope, parsed intent, prior state, planned harmony, effective bar and actual receipt when available.
    scheduled / accepted is not applied. Only confirmed active state changes the harmony display.
    Use agent.reply for concise user-facing confirmation or clarification; update the same messageId as execution advances.
  {type:'trace',traceId,stage,status,timestamp,model,component,input,output,request,response,durationMs,data}
  {type:'capabilities',capabilities}
  {type:'transcript',requestId,text,requiresConfirmation}
  {type:'input.interpretation',mode,target}
  {type:'clarification',requestId,message,options:[{id,label}]}
  {type:'agent.reply',messageId?,requestId?,message,status:'completed'|'scheduled'|'running'|'needs_input'|'error'}
  {type:'error',requestId,message}
  {type:'connection',connected:false}
Only forward real receipts. State/trace fields not provided remain absent.
Use trace stages capture, recognition, input_event, jam_state, band_plan,
model_request, model_response, render, playback, as available.
Backend transport waits for the expected phase and matching requestId when provided.
Backend BPM and meter wait for matching state receipts. Switching adapters invalidates old receipts.

LOCAL BEHAVIOR:
Manual meter selection lives on the drum-pad module: 4/4, 3/4, 6/8.
4/4 and 3/4 BPM count quarter notes; 6/8 BPM counts dotted-quarter notes
(two beats of three eighth-note subdivisions). The tempo dialog explains the unit.
Changing meter during local playback cancels future scheduled sounds and restarts
at the new bar, without resetting elapsed time. Actual scheduling drives pad flashes.
These are local preview rules; a connected backend owns confirmed playback timing.
Local Web Audio groove and synthesized keyboard/drum audition are labelled "本地试听".
The Harmony device never generates or infers local harmony. The Mixer is part of the master deck,
with local keyboard/drum gain controls while offline. No fabricated model/track output.
MIDI-file audition uses a local synth, not original instrument samples; previews at most
120 seconds while retaining the full input. No model output is generated by a fixture.
Real MediaRecorder audio, note events, permissions and device events are logged separately.
Recording captures target/mode at start. Offline/failed sends retain input.
File imports: text UTF-8 1 MiB; SMF0/1 MIDI 8 MiB; accepted audio containers 40 MiB.
Four simultaneous input drafts. Damaged or unsupported files receive explicit errors.
Microphone/hardware MIDI access requires a supporting browser and appropriate permissions.
Screen keyboard, drum pads and theme selection work without those devices.

Inspector is a non-modal split panel; close with X, trigger, or Escape inside the panel.
  BPM wheel adjusts by 1 (Shift: 5); the tempo extension is in normal layout flow.
  Inspector separates processing, music state,
and browser observations. ?release=1 hides the inspector and disables its collection;
protect real trace endpoints on the server as well.
-->
<link rel="stylesheet" href="jam-v4-template.css">
<link rel="stylesheet" href="jam-v4.css">
</head><body>
<div class="studio-atmosphere" aria-hidden="true"><span class="ambient-cool"></span><span class="ambient-warm"></span></div>
<div id="studioShell">
<header class="studio-header">
  <a class="brand" href="jam.html" aria-label="JamMate 首页"><b>JamMate</b></a>
  <div class="header-actions">
    <button id="backend-settings" class="inspector-trigger" type="button">设置</button>
    <div class="theme-switch" role="group" aria-label="强调色">
      <button class="theme-dot selected" type="button" data-theme="burgundy" title="酒红" aria-label="酒红主题" aria-pressed="true"></button>
      <button class="theme-dot" type="button" data-theme="orange" title="暖橙" aria-label="暖橙主题" aria-pressed="false"></button>
      <button class="theme-dot" type="button" data-theme="sage" title="鼠尾草绿" aria-label="鼠尾草绿主题" aria-pressed="false"></button>
    </div>
    <button id="insBtn" class="inspector-trigger" type="button" aria-controls="ins" aria-expanded="false">运行日志</button>
  </div>
</header>
<main id="mainUI" class="studio-main">
  <section class="workbench" aria-label="JamMate 音乐工作台">
    <div class="deck-area" id="deckArea">
    <section class="deck device-case" id="deck" aria-label="播放与总音量">
      <div class="platter" aria-hidden="true"><div class="vinyl"><div class="vinyl-label"><span>JamMate</span></div><i class="record-spindle"></i></div></div>
      <div class="tonearm" aria-hidden="true"><span class="arm-pivot"></span><span class="arm-rod"></span><span class="arm-head"></span></div>
      <div class="deck-screen">
        <span id="sourceLabel" class="source-label">本地试听</span>
        <span id="sessionStatus" role="status">未开始</span>
        <button id="tempoBtn" type="button" aria-controls="tempoPopover" aria-expanded="false" title="设置速度"><span id="tempoValue">96</span><span class="bpm-unit" id="tempoUnit">BPM</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 6 3 3 3-3"/></svg></button>
      </div>
      <button class="play-button" id="play" type="button" aria-label="播放本地节拍" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></svg></button>
      <div class="master-control">
        <div class="master-knob" id="masterKnob" role="slider" tabindex="0" aria-label="总音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" aria-valuetext="80%"><div class="master-knob-marker"></div><output class="master-value">80%</output></div>
        <span class="master-label">总音量</span>
      </div>
      <button class="mixer-toggle" type="button" id="mixerBtn" aria-expanded="false" aria-controls="mixerExtension"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 4v16m7-16v16m7-16v16M2 8h6m1 8h6m1-5h6"/></svg>混音</button>
    </section>
    <section class="tempo-popover tempo-extension" id="tempoPopover" role="region" aria-label="设置速度" hidden>
    <div class="popover-heading"><span>速度</span><button type="button" class="quiet-icon" id="tempoClose" aria-label="关闭速度设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <form id="tempoForm">
      <div class="tempo-entry"><button type="button" id="tempoDown" aria-label="降低 1 BPM">−</button><label><input id="bpmInput" type="number" min="30" max="250" step="1" value="96" inputmode="numeric" aria-label="每分钟拍数"><span>BPM</span></label><button type="button" id="tempoUp" aria-label="提高 1 BPM">+</button></div>
      <div class="tempo-actions"><button type="button" id="tapTempo">点拍定速</button><button type="submit" class="apply-tempo">应用</button></div>
      <p class="popover-note" id="tempoNote">30–250 BPM</p>
      <p class="popover-note" id="meterContext">4/4 · BPM 以四分音符为一拍。</p>
    </form>
  </section>
    <section class="mixer-extension device-case" id="mixerExtension" role="region" aria-label="混音" hidden>
      <div class="popover-heading"><span>混音</span><button type="button" class="quiet-icon" id="mixerClose" aria-label="关闭混音"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <p class="mixer-note" id="mixerNote"></p><div id="mixerRows"></div>
    </section>
    </div>
    <section class="instrument-workspace" aria-label="乐器工作区">
      <div id="stage" class="instrument-stage" aria-label="循环切换乐器"></div>
      <button class="stage-arrow previous" type="button" id="prev" aria-label="上一件乐器"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
      <button class="stage-arrow next" type="button" id="next" aria-label="下一件乐器"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button>
      <button type="button" id="instrumentName" class="instrument-name" title="对当前乐器输入">键盘</button>
    </section>
  </section>
  <section class="input-workspace" aria-label="统一输入">
    <section id="studio-suggestion" hidden aria-label="乐队提议">
      <p><span>乐队提议</span><strong id="suggestion-text" aria-live="polite"></strong></p>
      <div><button id="suggestion-accept" type="button">试试</button><button id="suggestion-skip" type="button">略过</button></div>
    </section>
    <section id="agentReplies" class="agent-replies" aria-label="乐队回应" hidden><div id="agentLatest" role="status" aria-live="polite"></div><details id="agentHistory" hidden><summary>最近回应</summary><div id="agentHistoryList"></div></details></section>
    <div id="drafts" class="drafts" aria-live="polite"></div>
    <form id="dock" class="studio-dock" aria-label="向乐队输入">
      <div class="target-chip" id="targetChip"><svg class="target-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="1.5"/><path d="M8 7v6m4-6v6m4-6v6M7 13v5m5-5v5m5-5v5"/></svg><span class="target-prefix">对</span><span id="targetName">键盘</span><button id="clearTarget" type="button" aria-label="切回全乐队" title="切回全乐队"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8m0-8-8 8"/></svg></button></div>
      <label class="command-field"><span class="sr-only">给乐队的指令</span><input id="txt" type="text" placeholder="告诉键盘你的想法…" autocomplete="off" maxlength="1000"></label>
      <button id="sendText" class="send-text" type="submit" aria-label="发送文字" title="发送文字" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      <div class="input-modes" id="inputModes" role="group" aria-label="输入模式"><button type="button" data-mode="auto" class="selected" aria-pressed="true">自动</button><button type="button" data-mode="speech" aria-pressed="false">说话</button><button type="button" data-mode="humming" aria-pressed="false">哼唱</button><button type="button" data-mode="rhythm" aria-pressed="false">拍手</button></div>
      <button id="attachBtn" class="attach-button" type="button" aria-label="添加文本、MIDI 或音频" title="添加文本、MIDI 或音频"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 12 5-5a3 3 0 0 1 4 4l-7 7a5 5 0 0 1-7-7l8-8a2 2 0 0 1 3 3l-8 8"/></svg></button>
      <input type="file" id="fileInput" accept=".txt,.md,.mid,.midi,.wav,.mp3,.m4a,.ogg,.flac,.webm" multiple hidden>
      <canvas id="wave" class="input-wave" width="168" height="56" aria-hidden="true"></canvas>
      <button id="mic" class="mic-button" type="button" aria-label="开始录音" aria-pressed="false" title="语音、哼唱或拍手"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3m-3 0h6"/></svg></button>
    </form>
    <div class="input-status"><span id="inputHint">本地试听 · 尚未连接乐队</span><span id="recordingCaption" role="status" hidden></span></div>
  </section>

</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

</div>
<aside id="ins" role="complementary" aria-labelledby="insTitle" aria-describedby="insConnection" aria-hidden="true" inert>
  <div id="insResize" class="ins-resize" role="separator" aria-label="调整 Inspector 分区大小" aria-orientation="vertical" tabindex="0"></div>
  <div class="ins-head">
    <div class="ins-heading"><h2 id="insTitle">Inspector</h2><p id="insConnection"><i aria-hidden="true"></i><span>未连接后端</span></p></div>
    <div class="ins-head-actions"><button type="button" class="ins-text-button" id="insCopy">复制 JSON</button><button type="button" class="ins-close" id="insClose" aria-label="关闭 Inspector" title="关闭 · Esc"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  </div>
  <div class="ins-tabs" role="tablist" aria-label="检查内容">
    <button type="button" id="insTabTrace" role="tab" aria-selected="true" aria-controls="insTracePanel" data-ins-tab="trace">处理过程<span id="insTraceCount">0</span></button>
    <button type="button" id="insTabState" role="tab" aria-selected="false" aria-controls="insStatePanel" data-ins-tab="state" tabindex="-1">音乐状态</button>
    <button type="button" id="insTabBrowser" role="tab" aria-selected="false" aria-controls="insBrowserPanel" data-ins-tab="browser" tabindex="-1">浏览器<span id="insBrowserCount">0</span></button>
  </div>
  <div class="ins-scroll" id="insScroll">
    <section id="insTracePanel" role="tabpanel" aria-labelledby="insTabTrace" tabindex="0">
      <div class="ins-toolbar"><label for="insTraceSelect">输入</label><select id="insTraceSelect" aria-label="选择要审阅的输入"><option value="">最新输入</option></select></div>
      <div id="insTraceContent"></div>
    </section>
    <section id="insStatePanel" role="tabpanel" aria-labelledby="insTabState" tabindex="0" hidden><div id="insStateContent"></div></section>
    <section id="insBrowserPanel" role="tabpanel" aria-labelledby="insTabBrowser" tabindex="0" hidden>
      <div class="ins-toolbar"><select id="insBrowserFilter" aria-label="浏览器事件类型"><option value="all">全部操作</option><option value="input">输入与指令</option><option value="music">演奏与音量</option><option value="device">设备与连接</option><option value="error">错误</option></select><button type="button" class="ins-text-button ins-muted" id="insClearBrowser">清空</button></div>
      <p class="ins-source-note">本页的真实操作与设备事件，独立于后端处理记录。</p>
      <div id="insBrowserContent"></div>
    </section>
  </div>
  <div class="ins-footer"><span id="insRetention">只展示实际收到的事件</span><span id="insNotice" role="status" aria-live="polite"></span></div>
</aside>

<dialog id="backend-dialog" aria-labelledby="backend-title">
  <form method="dialog">
    <header><h2 id="backend-title">设置</h2><button class="inspector-trigger">关闭</button></header>
    <label>指令处理 <select id="backend-agent"><option value="rule">本地规则</option><option value="llm">大模型 Agent</option></select></label>
    <label>音符编排 <select id="backend-arranger"><option value="rule">本地规则</option><option value="llm_all">大模型编排</option></select></label>
    <label>音频后端 <select id="backend-renderer"><option value="synth">内置合成器</option><option value="fluidsynth">FluidSynth</option><option value="mrt2">内置伴奏 + MRT2 试听</option><option value="mrt2_stream">MRT2 流式伴奏</option><option value="mrt2_direct">MRT2 独立生成</option></select></label>
    <p id="backend-note" role="status"></p>
    <div class="backend-links"><button id="backend-stop" class="inspector-trigger" type="button" disabled>结束会话</button><a href="jam-classic.html">经典工作台 · 键盘、设置与日志</a></div>
  </form>
</dialog>
<section id="backend-output" hidden aria-label="音频输出">
  <p id="backend-preview-status" role="status" hidden></p>
  <audio id="backend-preview" preload="none" controls hidden aria-label="MRT2 试听"></audio>
  <a id="backend-preview-download" hidden download="JamMate-MRT2.wav">下载 MRT2 试听</a>
  <button id="backend-export" type="button" title="导出已播放的伴奏，最多十分钟" class="inspector-trigger" hidden>导出演奏 WAV</button>
</section>
<script src="jam-v4-template.js"></script>
<script type="module" src="jam-v4.js"></script>
</body></html>
