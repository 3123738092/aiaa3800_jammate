<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JamMate · 节拍输入</title><link rel="stylesheet" href="lab.css">
<main><nav><a href="/">← 输入工作台</a><a href="appendix.html">迭代附录</a></nav><p class="eyebrow">RHYTHM / INPUT EVENT</p><h1>先定速，再拍节奏。</h1><p>均匀拍四下，紧接着拍一小节 4/4 节奏，并录到小节完整结束。最长录制 20 秒。</p>
<section class="panel"><button id="record">开始录音</button> <button id="example">载入合成示例</button><label>或导入录音 <input id="file" type="file" accept="audio/*"></label><audio id="original" controls></audio><a id="download-original" hidden>下载原始音频</a>
<details><summary>已有明确速度时的设置</summary><label>输入方式 <select id="count"><option value="4">四下定速 + 一小节</option><option value="0">已知 BPM，无定速拍手</option></select></label><label>手动速度（60–180 BPM）<input id="tempo" type="number" min="60" max="180" step="any" value="100" required></label><label>小节起点（原录音秒数）<input id="origin" type="number" min="0" step="any" placeholder="自动"></label><p>留空时，四下定速模式从第 5 拍开始；已知 BPM 模式从第一次敲击开始。</p></details>
<button id="analyze" disabled>识别节拍</button><p id="status" role="status">录音或导入音频后开始分析。</p></section>
<section id="result" class="panel" hidden><h2>识别到的节奏</h2><p id="summary"></p><section id="band-panel" hidden></section><details><summary>查看输入数据</summary><pre id="event"></pre></details></section>
<p class="muted">点「生成音乐」后，乐队会保留你的拍点，沿着这个律动加入新的节奏和乐器。网格贴合度表示拍点和节拍网格有多接近。</p></main><script type="module" src="rhythm.js"></script></html>
