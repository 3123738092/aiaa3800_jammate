[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jammate"
version = "0.1.0"
description = "AI jam partner: hum, clap or talk to an AI band (AIAA 3800 course project)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pretty_midi>=0.2.10",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
llm = ["openai>=2,<3"]
live = ["sounddevice>=0.4"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
jammate = "jammate.cli:main"
jammate-events = "jammate.contracts.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jammate.contracts" = ["*.schema.json"]
"jammate.orchestration" = ["*.md", "*.schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: pure-logic tests, no audio devices or network",
    "integration: offline pipeline on synthetic audio",
]

[tool.coverage.run]
source = ["jammate"]
omit = [
    # Device-independent scheduler/capture tests exist; physical I/O remains manual.
    "*/jammate/live.py",
    "*/jammate/__main__.py",
]
